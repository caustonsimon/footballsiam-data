name: fotmob-squads

# Thai League 1 squads + club hub feeds from FotMob (src/fotmob_squads.py).
# Daily at 04:10 Bangkok (after the 03:00 match sync), plus manual runs.

on:
  schedule:
    - cron: '10 21 * * *'   # 04:10 Asia/Bangkok
  workflow_dispatch:
    inputs:
      club:
        description: 'Club key (port, buriram-united, ...) or all'
        type: string
        default: port
      dry_run:
        description: 'Dry run (no writes to WordPress)'
        type: boolean
        default: true

concurrency:
  group: fotmob-squads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  squads:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build squads
        working-directory: src
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          WP_APP_USERNAME: ${{ secrets.WP_APP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CLUB: ${{ inputs.club }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ARGS+=(--club "${INPUT_CLUB:-port}")
            [ "$INPUT_DRY_RUN" = "true" ] || ARGS+=(--live)
          else
            # scheduled: every Thai League 1 club (rolled out 22 Oct 2026)
            ARGS+=(--club all --live)
          fi
          python fotmob_squads.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squad-report
          path: src/out/
          if-no-files-found: ignore
