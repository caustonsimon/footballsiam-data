name: backfill-t3-links

# One-off (re-runnable): link Thai League 3 matches to club pages and set T3
# crests (src/backfill_t3_links.py). Added 23 Oct 2026. Manual only.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to WordPress)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill
        working-directory: src
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          WP_APP_USERNAME: ${{ secrets.WP_APP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          [ "${INPUT_DRY_RUN:-true}" = "true" ] || ARGS+=(--live)
          python backfill_t3_links.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t3-links
          path: src/out/
          if-no-files-found: ignore
