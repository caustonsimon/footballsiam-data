name: photo-cutout

# Player photos -> transparent cut-outs (src/photo_cutout.py), added 23 Oct
# 2026. Daily at 06:30 Bangkok, after the T1/T2 (04:10) and T3 (05:40) squad
# syncs, so new players' photos are cleaned the same morning. Already-cut
# photos are skipped without downloading.

on:
  schedule:
    - cron: '30 23 * * *'   # 06:30 Asia/Bangkok
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (cut-outs saved as an artifact, nothing uploaded)'
        type: boolean
        default: true
      limit:
        description: 'Max photos per shard (0 = all)'
        type: string
        default: '0'

concurrency:
  group: photo-cutout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/3', '1/3', '2/3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt "rembg[cpu]==2.0.86"
      - name: Cut out photos
        working-directory: src
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          WP_APP_USERNAME: ${{ secrets.WP_APP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          ARGS=(--shard "${{ matrix.shard }}" --limit "${INPUT_LIMIT:-0}")
          [ "${INPUT_DRY_RUN:-false}" = "true" ] || ARGS+=(--live)
          python photo_cutout.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutouts-${{ strategy.job-index }}
          path: src/out/cutouts/
          if-no-files-found: ignore
