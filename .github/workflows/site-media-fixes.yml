name: site-media-fixes

# Copy off-site club crests into the media library and fill in missing alt
# text (src/site_media_fixes.py). Added 5 Nov 2026. Manual, re-runnable.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to WordPress)'
        type: boolean
        default: true
      only:
        description: 'Part to run'
        type: choice
        default: both
        options: [both, crests, alt]

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        working-directory: src
        env:
          WP_APP_USERNAME: ${{ secrets.WP_APP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          ARGS=()
          [ "${INPUT_DRY_RUN:-true}" = "true" ] || ARGS+=(--live)
          [ "${INPUT_ONLY:-both}" = "both" ] || ARGS+=(--only "$INPUT_ONLY")
          python site_media_fixes.py "${ARGS[@]}"
