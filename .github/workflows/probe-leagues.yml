name: probe-leagues
# Manual: which FootyStats leagues are chosen for the given countries, their
# season ids and whether data is served yet (src/probe_leagues.py).
on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Countries (space separated)'
        type: string
        default: 'Indonesia Malaysia Singapore Vietnam'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        working-directory: src
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          INPUT_COUNTRIES: ${{ inputs.countries }}
        run: python probe_leagues.py $INPUT_COUNTRIES
